<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Create your Livestock Connect account.">
  <title>Create Account - Livestock Connect</title>
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- Supabase CDN - Load early -->

  <script src="js/supabase.js?v=3"></script>
</head>
<body class="no-nav">
  <div class="app-container">
    <header class="page-header">
      <a href="#" class="back-link" id="register-page-back" aria-label="Go back">← Back</a>
      <h1>Create Account</h1>
      <p class="text-muted" id="register-subtitle">Join as a farmer (seller) or buyer. Choose your role below.</p>
    </header>

    <div id="register-alert" class="alert" role="alert" aria-live="polite" style="display: none;"></div>

    <form id="register-form" novalidate>
      <!-- Step 1: Role -->
      <div id="register-step-role" class="register-flow-pane">
        <div class="form-group">
          <label class="form-label">Select Role</label>
          <div class="role-options">
            <label class="role-option" id="role-farmer-wrap">
              <input type="radio" name="role" value="farmer" id="role-farmer">
              <span class="role-option-icon">🐄</span>
              <div>
                <strong>Farmer (I sell animals)</strong>
                <span class="text-muted">Post livestock for sale and manage listings.</span>
              </div>
            </label>
            <label class="role-option" id="role-buyer-wrap">
              <input type="radio" name="role" value="buyer" id="role-buyer">
              <span class="role-option-icon">🛒</span>
              <div>
                <strong>Buyer (I want to buy animals)</strong>
                <span class="text-muted">Browse listings and contact farmers.</span>
              </div>
            </label>
          </div>
        </div>
      </div>

      <!-- Step 2: Details -->
      <div id="register-step-details" class="register-flow-pane" hidden>
        <div class="form-group register-back-step-wrap">
          <button type="button" class="register-back-step" id="register-change-role">← Change role</button>
        </div>
        <p class="register-role-summary text-muted" id="register-role-summary"></p>

        <div class="form-group">
          <label class="form-label" for="fullName">Full Name</label>
          <input type="text" id="fullName" class="form-input" placeholder="Your full name" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="phone">Phone Number</label>
          <input type="tel" id="phone" class="form-input" placeholder="07XXXXXXXX" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="location">Location</label>
          <input type="text" id="location" class="form-input" placeholder="Village or district" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="At least 6 characters" required minlength="6">
        </div>
        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-input" placeholder="Same as above" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </div>
    </form>

    <p class="text-muted mt-2 text-center">
      Already have an account? <a href="login.html">Login</a>
    </p>
  </div>

  <!-- Scripts - Correct order + small delay for CDN -->
  <script src="js/app.js?v=3"></script>
  <script src="js/supabase-client.js?v=3"></script>
  <script src="js/auth.js?v=3"></script>

  <script>
    (function () {
      // Your existing form logic (same as before)
      const form = document.getElementById('register-form');
      const alertEl = document.getElementById('register-alert');

      const stepRole = document.getElementById('register-step-role');
      const stepDetails = document.getElementById('register-step-details');
      const subtitleEl = document.getElementById('register-subtitle');
      const roleSummaryEl = document.getElementById('register-role-summary');
      const changeRoleBtn = document.getElementById('register-change-role');
      const pageBack = document.getElementById('register-page-back');

      const roleFarmer = document.getElementById('role-farmer');
      const roleBuyer = document.getElementById('role-buyer');

      const showAlert = (message, type = 'success') => {
        alertEl.textContent = message;
        alertEl.className = `alert alert-${type}`;
        alertEl.style.display = 'block';
        setTimeout(() => alertEl.style.display = 'none', 5000);
      };

      const showRoleStep = () => {
        stepRole.hidden = false;
        stepDetails.hidden = true;
        subtitleEl.textContent = 'Join as a farmer (seller) or buyer. Choose your role below.';
      };

      const showDetailsStep = () => {
        stepRole.hidden = true;
        stepDetails.hidden = false;
        subtitleEl.textContent = 'Fill in your details to finish creating your account.';
        roleSummaryEl.textContent = roleFarmer.checked ? 'Signing up as: Farmer (seller)' : 'Signing up as: Buyer';
      };

      roleFarmer.addEventListener('change', () => { if (roleFarmer.checked || roleBuyer.checked) showDetailsStep(); });
      roleBuyer.addEventListener('change', () => { if (roleFarmer.checked || roleBuyer.checked) showDetailsStep(); });

      changeRoleBtn.addEventListener('click', showRoleStep);
      pageBack.addEventListener('click', (e) => {
        if (!stepDetails.hidden) { e.preventDefault(); showRoleStep(); return; }
        window.history.back();
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const roleEl = form.querySelector('input[name="role"]:checked');
        const data = {
          fullName: form.fullName.value.trim(),
          email: form.email.value.trim(),
          phone: form.phone.value.trim(),
          location: form.location.value.trim(),
          role: roleEl ? roleEl.value : '',
          password: form.password.value,
          confirmPassword: form.confirmPassword.value
        };

        const result = await window.LivestockConnectAuth.registerUser(data);
        if (result.success) {
          showAlert(result.message, 'success');
          setTimeout(() => window.location.href = 'login.html', 1500);
        } else {
          showAlert(result.message || 'Registration failed', 'error');
        }
      });

      showRoleStep();
    })();
  </script>
</body>
</html>

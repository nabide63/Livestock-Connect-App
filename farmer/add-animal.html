<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#14532d">
  <title>Add Animal — Livestock Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css">
  <script src="../js/supabase.js?v=3"></script>

</head>
<body>
  <div class="page">
    <div class="topbar">
      <a href="#" class="topbar-back" onclick="event.preventDefault();history.back();return false;"><i class="fa-solid fa-chevron-left"></i></a>
      <span class="topbar-title">Add Animal</span>
    </div>
    <div class="form-body">
      <div id="add-alert" class="alert" role="alert" aria-live="polite"></div>
      <form id="add-animal-form" novalidate>
        <div class="field fade-in">
          <label class="field-label" for="animalType"><i class="fa-solid fa-cow"></i> Animal Type</label>
          <select id="animalType" class="select" name="animalType" required><option value="">Select type…</option></select>
        </div>
        <div class="two-col">
          <div class="field fade-in d1">
            <label class="field-label" for="weight"><i class="fa-solid fa-weight-scale"></i> Weight (kg)</label>
            <input type="text" id="weight" class="input" name="weight" placeholder="e.g. 150" inputmode="decimal">
          </div>
          <div class="field fade-in d1">
            <label class="field-label" for="age"><i class="fa-solid fa-circle-check"></i> Age</label>
            <input type="text" id="age" class="input" name="age" placeholder="e.g. 2 years">
          </div>
        </div>
        <div class="field fade-in d2">
          <label class="field-label" for="price"><i class="fa-solid fa-coins"></i> Price (UGX)</label>
          <input type="text" id="price" class="input" name="price" placeholder="e.g. 1,200,000" inputmode="numeric">
        </div>
        <div class="field fade-in d2">
          <label class="field-label" for="healthStatus"><i class="fa-solid fa-heart-pulse"></i> Health Status</label>
          <select id="healthStatus" class="select" name="healthStatus">
            <option value="Healthy">Healthy</option>
            <option value="Recovering">Recovering</option>
            <option value="Sick">Sick</option>
          </select>
        </div>
        <div class="field fade-in d3">
          <label class="field-label" for="location"><i class="fa-solid fa-location-dot"></i> Location</label>
          <input type="text" id="location" class="input" name="location" placeholder="Village or district">
        </div>
        <div class="field fade-in d3">
          <label class="field-label" for="description"><i class="fa-solid fa-list"></i> Description <span style="font-weight:400;text-transform:none;color:var(--s400,#94a3b8);">(optional)</span></label>
          <textarea id="description" class="input" name="description" placeholder="Extra details…"></textarea>
        </div>
        <div class="field fade-in d4">
          <label class="field-label" for="photo"><i class="fa-solid fa-camera"></i> Photo <span style="font-weight:400;text-transform:none;color:var(--s400,#94a3b8);">(optional)</span></label>
          <input type="file" id="photo" name="photo" accept="image/*" class="input" style="padding:10px;">
          <div id="photo-preview-wrap" class="photo-wrap">
            <div id="photo-preview"></div>
            <button type="button" class="btn btn-ghost btn-sm" id="photo-remove" style="margin-top:8px;"><i class="fa-solid fa-trash"></i> Remove photo</button>
          </div>
        </div>
        <button type="submit" id="submit-btn" class="btn btn-primary btn-block fade-in d5"><i class="fa-solid fa-plus"></i> Post Listing</button>
      </form>
    </div>
  </div>

  <script src="../js/app.js?v=3"></script>
  <script src="../js/supabase-client.js?v=3"></script>
  <script src="../js/auth.js?v=3"></script>
  <script src="../data/mock-data.js"></script>
  <script src="../js/livestock.js"></script>
  <script src="../js/cloudinary.js"></script>
  <script>
    (async function () {
      const _authOk = await window.LivestockConnect.requireAuth('farmer');
      if (!_authOk) return;

      const form       = document.getElementById('add-animal-form');
      const alertEl    = document.getElementById('add-alert');
      const submitBtn  = document.getElementById('submit-btn');
      const photoInput = document.getElementById('photo');
      const photoPreview     = document.getElementById('photo-preview');
      const photoPreviewWrap = document.getElementById('photo-preview-wrap');
      const photoRemoveBtn   = document.getElementById('photo-remove');

      // Populate animal types
      const animalTypeSelect = document.getElementById('animalType');
      const animalTypes = (typeof MOCK_DATA !== 'undefined' && MOCK_DATA.animalTypes)
        ? MOCK_DATA.animalTypes
        : ['Cow','Goat','Sheep','Hen','Rabbits','Pigs','Ducks','Turkeys','Pigeons','Guinea fowls'];
      animalTypes.forEach(function(t) {
        const opt = document.createElement('option');
        opt.value = t; opt.textContent = t;
        animalTypeSelect.appendChild(opt);
      });

      // Pre-fill location from user profile
      const user = await window.LivestockConnect.getCurrentUser();
      if (user && user.location) document.getElementById('location').value = user.location;

      function showAlert(message, type) {
        alertEl.textContent = message;
        alertEl.className = 'alert alert-' + (type === 'error' ? 'error' : 'success');
        alertEl.style.display = 'block';
        alertEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      function setBusy(busy, label) {
        submitBtn.disabled = busy;
        submitBtn.innerHTML = busy
          ? '<i class="fa-solid fa-spinner fa-spin"></i> ' + (label || 'Posting…')
          : '<i class="fa-solid fa-plus"></i> Post Listing';
      }

      // Photo preview helpers
      function resizeImageToDataUrl(file, maxWidth, quality, callback) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > maxWidth) { h = (h * maxWidth) / w; w = maxWidth; }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            try { callback(canvas.toDataURL('image/jpeg', quality)); }
            catch(err) { callback(e.target.result); }
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      function showPreview(dataUrl) {
        photoPreview.innerHTML = '<img src="' + dataUrl + '" alt="Preview" class="photo-preview-img">';
        photoPreview.setAttribute('data-url', dataUrl);
        photoPreviewWrap.style.display = 'block';
      }

      function hidePreview() {
        photoPreview.innerHTML = '';
        photoPreview.removeAttribute('data-url');
        photoPreviewWrap.style.display = 'none';
        photoInput.value = '';
      }

      photoInput.addEventListener('change', function() {
        const file = this.files[0];
        hidePreview();
        if (file && file.type.startsWith('image/')) {
          resizeImageToDataUrl(file, 600, 0.75, showPreview);
        }
      });
      photoRemoveBtn.addEventListener('click', hidePreview);

      // Form submit
      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        alertEl.style.display = 'none';

        const animalType = form.animalType.value;
        const weight     = form.weight.value.trim();
        const price      = form.price.value.trim().replace(/[,\s]/g, '');
        const location   = form.location.value.trim();

        if (!animalType) { showAlert('Please select an animal type.', 'error'); return; }
        if (!weight)     { showAlert('Please enter the weight.', 'error'); return; }
        if (!price)      { showAlert('Please enter the price.', 'error'); return; }
        if (!location)   { showAlert('Please enter the location.', 'error'); return; }

        const record = {
          animalType,
          age:         form.age.value.trim(),
          weight,
          price,
          healthStatus: form.healthStatus.value,
          location,
          description: form.description.value.trim(),
          imageData:   null
        };

        const file       = photoInput.files[0];
        const previewUrl = photoPreview.getAttribute('data-url');

        setBusy(true, 'Posting…');

        try {
          // Handle photo upload
          if (file && file.type.startsWith('image/')) {
            const Cloudinary = window.LivestockConnectCloudinary;
            if (Cloudinary && Cloudinary.isCloudinaryConfigured && Cloudinary.isCloudinaryConfigured()) {
              setBusy(true, 'Uploading photo…');
              try {
                record.imageData = await Cloudinary.uploadImage(file);
              } catch(uploadErr) {
                record.imageData = previewUrl || await new Promise(resolve =>
                  resizeImageToDataUrl(file, 600, 0.75, resolve)
                );
              }
            } else {
              record.imageData = await new Promise(resolve =>
                resizeImageToDataUrl(file, 600, 0.75, resolve)
              );
            }
          } else if (previewUrl) {
            record.imageData = previewUrl;
          }

          // FIX: addListing is async — must be awaited
          const result = await window.LivestockConnectLivestock.addListing(record);

          if (result.success) {
            showAlert('Animal listed successfully!', 'success');
            form.reset();
            hidePreview();
            if (user && user.location) document.getElementById('location').value = user.location;
          } else {
            showAlert(result.message || 'Failed to post listing.', 'error');
          }
        } catch(err) {
          showAlert('An error occurred: ' + err.message, 'error');
        } finally {
          setBusy(false);
        }
      });
    })();
  </script>
</body>
</html>
